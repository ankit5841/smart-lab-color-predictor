services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://smartlab:smartlab@db:5432/smartlab_db
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SMARTLAB_API_KEY: ${SMARTLAB_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smartlab
      POSTGRES_PASSWORD: smartlab
      POSTGRES_DB: smartlab_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartlab -d smartlab_db"]
      interval: 5s
      timeout: 5s
      retries: 5
